<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="220" fill="transparent" />

  <!-- Background decorative wave 1 -->
  <path d="M0,0 L1200,0 L1200,140 Q900,190 600,130 Q300,70 0,150 Z" fill="url(#wave-grad-1)" />

  <!-- Main flowing wave -->
  <path d="M0,0 L1200,0 L1200,120 Q950,175 650,115 Q350,55 0,135 Z" fill="url(#wave-grad-2)" />

  <!-- Content -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Title -->
    <text x="600" y="80" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="1.5" filter="url(#glow)">
      Võ Văn Cường
    </text>

    <!-- Subtitle -->
    <text x="600" y="115" fill="#E0E7FF" font-size="20" font-weight="500" letter-spacing="1">
      Crafting Scalable Backends &amp; Digital Logic ⚡
    </text>
  </g>
</svg>
